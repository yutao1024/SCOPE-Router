# VLM Router Benchmark - Token-Based Pricing
# Based on Together.AI pricing standards ($/M tokens)
# Reference: https://www.together.ai/pricing (Nov 2024)
# Updated: Nov 2025 - Extended to 17 models (15 open-source + 2 API models)
# 
# Price structure:
# - 1-2B models: ~$0.05 input, ~$0.05 output per 1M tokens
# - 3B models: ~$0.08 input, ~$0.08 output per 1M tokens
# - 7-8B models: ~$0.18-0.20 input, ~$0.20-0.30 output per 1M tokens
# - 12B models: ~$0.25 input, ~$0.35 output per 1M tokens
# - 27B models: ~$0.35 input, ~$0.50 output per 1M tokens
# - 32B models: ~$0.40 input, ~$0.60 output per 1M tokens
# - 70-78B models: ~$0.88-1.0 input, ~$1.2-1.5 output per 1M tokens

pricing:
  InternVL2_5-78B:
    type: "token_based"
    input_price_per_1m: 1.0  # $/1M input tokens (slightly higher than 70B due to vision)
    output_price_per_1m: 1.5  # $/1M output tokens
    # ~78B params, vision-enhanced model, similar to Llama 3.1 70B
    
  MiMo-VL-7B-RL:
    type: "token_based"
    input_price_per_1m: 0.2  # $/1M input tokens
    output_price_per_1m: 0.3  # $/1M output tokens
    # ~7B params, RL-tuned, similar to Llama 3.1 8B
    
  Phi-3.5-Vision:
    type: "token_based"
    input_price_per_1m: 0.1  # $/1M input tokens
    output_price_per_1m: 0.1  # $/1M output tokens
    # Small vision model (~3.8B params), similar to Llama 3.2 3B
    
  Qwen2.5-VL-32B-Instruct:
    type: "token_based"
    input_price_per_1m: 0.4  # $/1M input tokens
    output_price_per_1m: 0.6  # $/1M output tokens
    # ~32B params, interpolated between 8B and 70B
    
  Qwen2.5-VL-72B-Instruct:
    type: "token_based"
    input_price_per_1m: 0.8  # $/1M input tokens
    output_price_per_1m: 1.2  # $/1M output tokens
    # ~72B params, similar to Llama 3.1 70B
    
  SmolVLM2:
    type: "token_based"
    input_price_per_1m: 0.06  # $/1M input tokens
    output_price_per_1m: 0.06  # $/1M output tokens
    # Very small model (~2B params), similar to Llama 3.2 3B
    
  llava_next_vicuna_7b:
    type: "token_based"
    input_price_per_1m: 0.2  # $/1M input tokens
    output_price_per_1m: 0.2  # $/1M output tokens
    # ~7B params, similar to Llama 3.1 8B
    
  Gemma3-27B:
    type: "token_based"
    input_price_per_1m: 0.35  # $/1M input tokens
    output_price_per_1m: 0.50  # $/1M output tokens
    # ~27B params, Google's vision model
    
  Janus-Pro-1B:
    type: "token_based"
    input_price_per_1m: 0.05  # $/1M input tokens
    output_price_per_1m: 0.05  # $/1M output tokens
    # ~1B params, very lightweight
    
  Janus-Pro-7B:
    type: "token_based"
    input_price_per_1m: 0.18  # $/1M input tokens
    output_price_per_1m: 0.25  # $/1M output tokens
    # ~7B params, DeepSeek's vision model
    
  Kimi-VL-A3B-Thinking-2506:
    type: "token_based"
    input_price_per_1m: 0.2  # $/1M input tokens
    output_price_per_1m: 0.25  # $/1M output tokens
    # ~16B params, thinking-enhanced model
    
  Pixtral-12B:
    type: "token_based"
    input_price_per_1m: 0.25  # $/1M input tokens
    output_price_per_1m: 0.35  # $/1M output tokens
    # ~12B params, Mistral's vision model
    
  Qianfan-VL-8B:
    type: "token_based"
    input_price_per_1m: 0.18  # $/1M input tokens
    output_price_per_1m: 0.25  # $/1M output tokens
    # ~8B params, Baidu's vision model
    
  deepseek_vl2:
    type: "token_based"
    input_price_per_1m: 0.35  # $/1M input tokens
    output_price_per_1m: 0.50  # $/1M output tokens
    # ~27B params, DeepSeek-VL2 main model
    
  deepseek_vl2_tiny:
    type: "token_based"
    input_price_per_1m: 0.05  # $/1M input tokens
    output_price_per_1m: 0.05  # $/1M output tokens
    # ~1.0B params, DeepSeek-VL2 tiny version
  
  GPT4o:
    type: "token_based"
    input_price_per_1m: 2.5  # $/1M input tokens
    output_price_per_1m: 10.0  # $/1M output tokens
    # OpenAI GPT-4o, flagship multimodal model
    # API model, high performance
  
  GeminiFlash2-5:
    type: "token_based"
    input_price_per_1m: 0.3  # $/1M input tokens
    output_price_per_1m: 2.4  # $/1M output tokens
    # Google Gemini Flash 2.5, efficient API model
    # Much cheaper than GPT-4o with competitive performance

# Router overhead (set to 0 for MVP; can be refined later)
router_overhead:
  image_encoder_ms: 0.0
  text_encoder_ms: 0.0
  knn_inference_ms: 0.0
  total_usd_per_sample: 0.0

# Budget sampling points (for the cost-quality curve)
budgets_usd: [0.003, 0.005, 0.007, 0.01, 0.015, 0.02, 0.025]

# Cost models (for more fine-grained billing; optional for MVP)
cost_models:
  token_based:
    enabled: false
    input_tokens_cost: 0.0
    output_tokens_cost: 0.0
  
  latency_based:
    enabled: false
    gpu_hour_cost: 0.50
    
  combined:
    enabled: true
    method: "fixed_per_sample"  # MVP uses a fixed per-sample price
